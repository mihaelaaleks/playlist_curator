# Curator API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator-api
spec:
  replicas: 1
  # add rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: curator-api
  template:
    metadata:
      labels:
        app: curator-api
    spec:
      containers:
      - name: curator-api
        image: curator-service:latest
        imagePullPolicy: Never  # Use local image, don't try to pull
        ports:
        - containerPort: 8000
        env:
        - name: SPOTIFY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: spotify-credentials
              key: SPOTIFY_CLIENT_ID
        - name: SPOTIFY_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: spotify-credentials
              key: SPOTIFY_REDIRECT_URI
        - name: UI_URL
          valueFrom:
            configMapKeyRef:
              name: curator-config
              key: UI_URL        

---
# Curator API Service
apiVersion: v1
kind: Service
metadata:
  name: curator-api
spec:
  selector:
    app: curator-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
# Curator Web Deployment  
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curator-web
  template:
    metadata:
      labels:
        app: curator-web
    spec:
      containers:
      - name: curator-web
        image: curator-ui:latest
        imagePullPolicy: Never  # Use local image, don't try to pull
        ports:
        - containerPort: 80
        env:
        - name: CURATOR_API_URL
          valueFrom:
            configMapKeyRef:
              name: curator-config
              key: CURATOR_API_URL

---
# Curator Web Service
apiVersion: v1
kind: Service
metadata:
  name: curator-web
spec:
  selector:
    app: curator-web
  ports:
  - port: 80
    targetPort: 80
  type: NodePort  # Allows external access in minikube